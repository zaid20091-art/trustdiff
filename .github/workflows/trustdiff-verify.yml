# Reusable, protected verification workflow.
#
# Trust model (see docs/SECURITY_MODEL.md):
#   * the VERIFIER comes from the PR's base commit and must hash to a value approved OUTSIDE the branch
#     under test (repository/organisation variable TRUSTDIFF_VERIFIER_SHA256) - a PR cannot change either;
#   * the CANDIDATE is checked out as DATA. No step executes anything from it on the runner host;
#     test code runs only inside the constrained, digest-pinned container;
#   * the `verify` job has no secrets and no environment. Signing happens in a separate `attest` job that
#     is bound to a protected environment and runs only the trusted verifier.
name: TrustDiff Verify (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
      base-sha:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      sign:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Check out the TRUSTED verifier from the base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base-sha }}
          path: trusted
          persist-credentials: false
      - name: Require the externally approved verifier digest
        env:
          EXPECTED: ${{ vars.TRUSTDIFF_VERIFIER_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          FILES = ("trustdiff.py", "trustdiff_impact.py", "trustdiff_challenge.py", "trustdiff_runner.py", "trustdiff_proof.py", "trustdiff_safe.py", "trustdiff_evidence.py", "trustdiff_store.py", "trustdiff_supply.py", "trustdiff_repair.py")
          files = {}
          for name in FILES:
              path = pathlib.Path("trusted") / name
              if path.is_symlink() or not path.is_file():
                  sys.exit("verifier file missing: " + name)
              files[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          digest = hashlib.sha256(json.dumps({"version": 1, "files": files}, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          expected = os.environ.get("EXPECTED", "").strip().lower()
          if not expected:
              sys.exit("Repository variable TRUSTDIFF_VERIFIER_SHA256 is not set; refusing to run an unapproved verifier. Digest of this base commit: " + digest)
          if digest != expected:
              sys.exit("Verifier digest " + digest + " does not match the approved " + expected)
          print("verifier digest approved:", digest)
          PY
      - name: Check out the CANDIDATE (data only; never executed on this host)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ inputs.pr-number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the candidate is exactly the commit under review
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
      - name: Require a digest-pinned runner image
        id: image
        env:
          IMAGE: ${{ vars.TRUSTDIFF_RUNNER_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/:-]*@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Repository variable TRUSTDIFF_RUNNER_IMAGE must be an image reference pinned by @sha256 digest"
            exit 1
          fi
          docker pull "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Verify (trusted verifier, untrusted data)
        id: gate
        working-directory: candidate
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RUNTIME: ${{ vars.TRUSTDIFF_RUNNER_RUNTIME }}
          EXPECTED: ${{ vars.TRUSTDIFF_VERIFIER_SHA256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/td-home"
          runtime=()
          if [[ -n "$RUNTIME" ]]; then runtime=(--runtime "$RUNTIME"); fi
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/td-home" TRUSTDIFF_STATE_DIR="$RUNNER_TEMP/td-evidence" \
            python3 -E -s -B "$GITHUB_WORKSPACE/trusted/trustdiff.py" check --baseline "$BASE_SHA" --repository "$REPOSITORY" --verifier-sha256 "$EXPECTED" --runner docker --image "$IMAGE_REF" --require-pinned-image --challenge-mode run "${runtime[@]}"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Render review summary and SARIF
        if: always()
        working-directory: candidate
        run: |
          export TRUSTDIFF_STATE_DIR="$RUNNER_TEMP/td-evidence"
          if [ -f "$TRUSTDIFF_STATE_DIR/latest.json" ]; then
            python3 -E -s -B "$GITHUB_WORKSPACE/trusted/trustdiff.py" report --format markdown --output "$TRUSTDIFF_STATE_DIR/summary.md"
            python3 -E -s -B "$GITHUB_WORKSPACE/trusted/trustdiff.py" report --format sarif --output "$TRUSTDIFF_STATE_DIR/findings.sarif"
          fi
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trustdiff-evidence
          path: ${{ runner.temp }}/td-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Require TrustDiff to pass
        if: always()
        env:
          STATUS: ${{ steps.gate.outputs.status }}
        run: test "$STATUS" = "0"

  attest:
    name: attest
    needs: verify
    if: ${{ !cancelled() && inputs.sign && (needs.verify.outputs.status == '0' || needs.verify.outputs.status == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: trustdiff-signing
    permissions:
      contents: read
    steps:
      - name: Check out the TRUSTED verifier from the base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base-sha }}
          path: trusted
          persist-credentials: false
      - name: Require the externally approved verifier digest
        env:
          EXPECTED: ${{ vars.TRUSTDIFF_VERIFIER_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          FILES = ("trustdiff.py", "trustdiff_impact.py", "trustdiff_challenge.py", "trustdiff_runner.py", "trustdiff_proof.py", "trustdiff_safe.py", "trustdiff_evidence.py", "trustdiff_store.py", "trustdiff_supply.py", "trustdiff_repair.py")
          files = {}
          for name in FILES:
              path = pathlib.Path("trusted") / name
              if path.is_symlink() or not path.is_file():
                  sys.exit("verifier file missing: " + name)
              files[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          digest = hashlib.sha256(json.dumps({"version": 1, "files": files}, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          expected = os.environ.get("EXPECTED", "").strip().lower()
          if not expected:
              sys.exit("Repository variable TRUSTDIFF_VERIFIER_SHA256 is not set; refusing to sign with an unapproved verifier. Digest of this base commit: " + digest)
          if digest != expected:
              sys.exit("Verifier digest " + digest + " does not match the approved " + expected)
          print("verifier digest approved:", digest)
          PY
      - name: Check out the candidate (data only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ inputs.pr-number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the candidate is exactly the commit that was verified
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
      - name: Download the evidence produced by the verify job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trustdiff-evidence
          path: ${{ runner.temp }}/td-evidence
      - name: Install the signing dependency from the hash-locked file in the trusted base
        run: |
          set -euo pipefail
          test -f trusted/requirements-signing.lock || { echo "::error::trusted/requirements-signing.lock (pip --require-hashes) is required"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/sign-venv"
          "$RUNNER_TEMP/sign-venv/bin/pip" install --require-hashes --no-deps -r trusted/requirements-signing.lock
      - name: Sign (only the trusted verifier runs; the key never touches the candidate)
        working-directory: candidate
        env:
          SIGNING_KEY: ${{ secrets.TRUSTDIFF_SIGNING_KEY }}
          PRINCIPAL: ${{ vars.TRUSTDIFF_PRINCIPAL }}
          EXPECTED: ${{ vars.TRUSTDIFF_VERIFIER_SHA256 }}
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRINCIPAL"
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          export TRUSTDIFF_STATE_DIR="$RUNNER_TEMP/td-evidence"
          "$RUNNER_TEMP/sign-venv/bin/python" -E -s -B "$GITHUB_WORKSPACE/trusted/trustdiff.py" attest --key "$key" --principal "$PRINCIPAL" --include-failure --expected-baseline "$BASE_SHA" --expected-commit "$HEAD_SHA" --expected-repository "$REPOSITORY" --require-verifier-sha256 "$EXPECTED" --output "$RUNNER_TEMP/proof.json"
      - name: Upload the signed proof bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trustdiff-proof
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
